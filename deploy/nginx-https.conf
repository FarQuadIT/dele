server {
    listen 80;
    listen [::]:80;
    server_name 176.118.222.21;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dele-acme; default_type text/plain; }
    location / { return 301 https://176.118.222.21$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 176.118.222.21;
    root /srv/dele/current/public;
    index index.php;
    ssl_certificate /etc/letsencrypt/live/176.118.222.21/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/176.118.222.21/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 20m;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
